<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Link Custom CSS -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles-res-577-768.css">
  <link rel="stylesheet" href="styles-res-769-992.css">
  <link rel="stylesheet" href="styles-res-max-576.css">
  <link rel="stylesheet" href="contact.css">
</head>
<body>

  <main>
    <section class="contact">
      <div class="row">
        <div class="col-6 contact-img-col">
          <img src="contact-us-img-1.svg" alt="">
        </div>
        <div class="col-6 contact-form-col">
          <div>
            <form>
              <h2 class="title-contavt-us">Contact Us</h2>
              <div class="form-group">
                <input class="inpot-text" type="text" placeholder="First Name" required>
                <input class="inpot-text" type="text" placeholder="Last Name" required>
              </div>
              <div class="form-group">
                <input class="inpot-text" type="email" placeholder="Email" required>
                <input class="inpot-text" type="tel" placeholder="Phone" required>
              </div>
              <div class="form-group">
                <input class="inpot-text" type="text" placeholder="Job Title">
                <input class="inpot-text" type="text" placeholder="Subject" required>
              </div>
              <textarea class="inpot-text" placeholder="Leave us a message..."></textarea>
              <button class="submit-btn">Submit</button>
            </form>
        </div>
        </div>
      </div>
    </section>
  </main>


  <script src="script.js"></script>
</body>

</html>
